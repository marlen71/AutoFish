name: Eternal Core Windows and server

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test server, SQLite, users, subscriptions, and HWID
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & python -m unittest discover -s rmacro/tests -v 2>&1
          $testExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          foreach ($line in $output) { Write-Host $line }
          if ($testExit -ne 0) {
            # The tail contains unittest tracebacks and remains available as a
            # check annotation if Actions log downloads are unavailable.
            $detail = ($output | Out-String)
            # GitHub caps annotations at 4096 characters; retain the traceback
            # at the end rather than truncating it behind routine request logs.
            if ($detail.Length -gt 3000) { $detail = $detail.Substring($detail.Length - 3000) }
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=RMacro server tests::$detail"
            throw "Server integration tests failed: $testExit"
          }

      - name: Test trusted loader update selection
        shell: powershell
        run: .\rmacro\tests\Run-UpdatePolicy.ps1

      - name: Build the single-file Eternal Core loader
        shell: powershell
        run: |
          try { .\Build-RMacro.ps1 }
          catch {
            $detail = ($_ | Format-List * -Force | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            if ($detail.Length -gt 5000) { $detail = $detail.Substring(0, 5000) }
            Write-Output "::error title=RMacro build::$detail"
            throw
          }

      - name: Test client prerequisites without installing anything
        shell: powershell
        run: .\rmacro\tests\Smoke-Setup.ps1

      - name: Test atomic loader update and rollback
        timeout-minutes: 3
        shell: powershell
        run: |
          try { .\rmacro\tests\Smoke-Updater.ps1 }
          catch {
            $detail = ($_ | Format-List * -Force | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            if ($detail.Length -gt 3000) { $detail = $detail.Substring(0, 3000) }
            Write-Output "::error title=Updater test wrapper::$detail"
            throw
          }

      - name: Test real GitHub metadata and loader download without installation
        timeout-minutes: 3
        shell: powershell
        run: .\rmacro\tests\Smoke-UpdateNetwork.ps1

      - name: Test the private HTTPS gateway and pinned CA on Windows
        timeout-minutes: 10
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\rmacro\tests\Smoke-InternetGateway.ps1

      - name: Test Windows login, DPAPI, embedded product and revoked access
        timeout-minutes: 3
        shell: powershell
        env:
          RMACRO_UI_SCREENSHOTS: ${{ runner.temp }}/rmacro-screenshots
        run: .\rmacro\tests\Smoke-RMacro.ps1

      - name: Test the administrator UI in Chrome
        timeout-minutes: 4
        shell: powershell
        env:
          RMACRO_UI_SCREENSHOTS: ${{ runner.temp }}/rmacro-screenshots
        run: .\rmacro\tests\Smoke-AdminBrowser.ps1

      - name: Check standalone loader and emergency BAT
        shell: powershell
        run: .\rmacro\tests\Smoke-RMacroForceStop.ps1

      - name: Keep screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmacro-screenshots
          path: ${{ runner.temp }}/rmacro-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Package client, server, and manual admin-panel patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Item 'dist\EternalCore.exe').VersionInfo.ProductVersion
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Unexpected version: $version" }
          $client = Join-Path $env:RUNNER_TEMP 'rmacro-client-stage'
          $server = Join-Path $env:RUNNER_TEMP 'rmacro-server-stage'
          $adminPatch = Join-Path $env:RUNNER_TEMP 'rmacro-admin-patch-stage'
          $internetPatch = Join-Path $env:RUNNER_TEMP 'rmacro-internet-patch-stage'
          $assets = Join-Path $env:RUNNER_TEMP 'rmacro-release-assets'
          New-Item -ItemType Directory -Path $client, $server, $adminPatch, $internetPatch, $assets -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $adminPatch 'static') -Force | Out-Null
          Copy-Item 'dist\EternalCore.exe' (Join-Path $client 'EternalCore.exe')
          Copy-Item 'rmacro\client\STOP-ETERNAL-CORE.bat' (Join-Path $client 'STOP-ETERNAL-CORE.bat')
          Copy-Item 'rmacro\client\EMERGENCY-ETERNAL-CORE.bat' (Join-Path $client 'EMERGENCY-ETERNAL-CORE.bat')
          Copy-Item 'rmacro\client\SETUP-ETERNAL-CORE.bat' (Join-Path $client 'SETUP-ETERNAL-CORE.bat')
          Copy-Item 'rmacro\client\SETUP-ETERNAL-CORE.ps1' (Join-Path $client 'SETUP-ETERNAL-CORE.ps1')
          $instruction = (Get-Content 'rmacro\client\INSTRUCTIONS.txt' -Raw -Encoding UTF8).Replace("`r`n", "`n").Replace("`n", "`r`n")
          [IO.File]::WriteAllText((Join-Path $client 'INSTRUCTIONS.txt'), $instruction, [Text.UTF8Encoding]::new($true))
          foreach ($name in @('server.py','internet_gateway.py','README-SERVER.md','RUN-PYTHON.bat','SETUP-ADMIN.bat','START-SERVER.bat','RESET-ADMIN.bat','BACKUP.bat','CONFIGURE-LOADER.bat','CONFIGURE-INTERNET.bat','START-INTERNET.bat')) {
            Copy-Item (Join-Path 'rmacro\server' $name) (Join-Path $server $name)
          }
          Copy-Item 'rmacro\server\static' (Join-Path $server 'static') -Recurse
          Copy-Item 'rmacro\server\static\app.js' (Join-Path $adminPatch 'static\app.js')
          $patchInstruction = (Get-Content 'docs\ADMIN-PANEL-UPDATE.txt' -Raw -Encoding UTF8).Replace("`r`n", "`n").Replace("`n", "`r`n")
          [IO.File]::WriteAllText((Join-Path $adminPatch 'INSTRUCTIONS.txt'), $patchInstruction, [Text.UTF8Encoding]::new($true))
          foreach ($name in @('server.py','internet_gateway.py','CONFIGURE-INTERNET.bat','START-INTERNET.bat')) {
            Copy-Item (Join-Path 'rmacro\server' $name) (Join-Path $internetPatch $name)
          }
          $internetInstruction = (Get-Content 'docs\INTERNET-UPDATE.txt' -Raw -Encoding UTF8).Replace("`r`n", "`n").Replace("`n", "`r`n")
          [IO.File]::WriteAllText((Join-Path $internetPatch 'INSTRUCTIONS.txt'), $internetInstruction, [Text.UTF8Encoding]::new($true))
          $clientName = "EternalCore-v$version-Windows.zip"
          $serverName = "EternalCore-Server-v$version-Windows.zip"
          $adminName = "EternalCore-Admin-Update-v$version.zip"
          $internetName = "EternalCore-Internet-Update-v$version.zip"
          Compress-Archive -Path (Join-Path $client '*') -DestinationPath (Join-Path $assets $clientName) -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $server '*') -DestinationPath (Join-Path $assets $serverName) -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $adminPatch '*') -DestinationPath (Join-Path $assets $adminName) -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $internetPatch '*') -DestinationPath (Join-Path $assets $internetName) -CompressionLevel Optimal
          Copy-Item 'dist\EternalCore.exe' (Join-Path $assets 'EternalCore.exe')
          $clientVerify = Join-Path $env:RUNNER_TEMP 'rmacro-client-verify'
          $serverVerify = Join-Path $env:RUNNER_TEMP 'rmacro-server-verify'
          $adminVerify = Join-Path $env:RUNNER_TEMP 'rmacro-admin-patch-verify'
          $internetVerify = Join-Path $env:RUNNER_TEMP 'rmacro-internet-patch-verify'
          Expand-Archive (Join-Path $assets $clientName) -DestinationPath $clientVerify
          Expand-Archive (Join-Path $assets $serverName) -DestinationPath $serverVerify
          Expand-Archive (Join-Path $assets $adminName) -DestinationPath $adminVerify
          Expand-Archive (Join-Path $assets $internetName) -DestinationPath $internetVerify
          foreach ($name in @('EternalCore.exe','STOP-ETERNAL-CORE.bat','EMERGENCY-ETERNAL-CORE.bat','SETUP-ETERNAL-CORE.bat','SETUP-ETERNAL-CORE.ps1','INSTRUCTIONS.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $clientVerify $name) -PathType Leaf)) { throw "Missing client file $name" }
          }
          if (@(Get-ChildItem $clientVerify -File -Recurse).Count -ne 6) { throw 'Unexpected client files.' }
          foreach ($name in @('server.py','internet_gateway.py','README-SERVER.md','RUN-PYTHON.bat','SETUP-ADMIN.bat','START-SERVER.bat','RESET-ADMIN.bat','BACKUP.bat','CONFIGURE-LOADER.bat','CONFIGURE-INTERNET.bat','START-INTERNET.bat','static\index.html','static\app.js','static\style.css','static\logo.png','static\mark.png','static\favicon.ico')) {
            if (-not (Test-Path -LiteralPath (Join-Path $serverVerify $name) -PathType Leaf)) { throw "Missing server file $name" }
          }
          if (@(Get-ChildItem $serverVerify -File -Recurse).Count -ne 17) { throw 'Unexpected server files or private state in package.' }
          foreach ($name in @('static\app.js','INSTRUCTIONS.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $adminVerify $name) -PathType Leaf)) { throw "Missing admin patch file $name" }
          }
          if (@(Get-ChildItem $adminVerify -File -Recurse).Count -ne 2) { throw 'Unexpected files in the manual admin patch.' }
          if ((Get-FileHash 'rmacro\server\static\app.js' -Algorithm SHA256).Hash -ne (Get-FileHash (Join-Path $adminVerify 'static\app.js') -Algorithm SHA256).Hash) { throw 'Admin patch script mismatch.' }
          foreach ($name in @('server.py','internet_gateway.py','CONFIGURE-INTERNET.bat','START-INTERNET.bat','INSTRUCTIONS.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $internetVerify $name) -PathType Leaf)) { throw "Missing internet patch file $name" }
          }
          if (@(Get-ChildItem $internetVerify -File -Recurse).Count -ne 5) { throw 'Unexpected files in the internet patch.' }
          foreach ($name in @('server.py','internet_gateway.py','CONFIGURE-INTERNET.bat','START-INTERNET.bat')) {
            if ((Get-FileHash (Join-Path 'rmacro\server' $name) -Algorithm SHA256).Hash -ne (Get-FileHash (Join-Path $internetVerify $name) -Algorithm SHA256).Hash) { throw "Internet patch mismatch: $name" }
          }
          $exeHash = (Get-FileHash (Join-Path $assets 'EternalCore.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-FileHash (Join-Path $clientVerify 'EternalCore.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $exeHash) { throw 'Client EXE hash mismatch.' }
          $clientHash = (Get-FileHash (Join-Path $assets $clientName) -Algorithm SHA256).Hash.ToLowerInvariant()
          $serverHash = (Get-FileHash (Join-Path $assets $serverName) -Algorithm SHA256).Hash.ToLowerInvariant()
          $adminHash = (Get-FileHash (Join-Path $assets $adminName) -Algorithm SHA256).Hash.ToLowerInvariant()
          $internetHash = (Get-FileHash (Join-Path $assets $internetName) -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksums = "$exeHash  EternalCore.exe`r`n$clientHash  $clientName`r`n$serverHash  $serverName`r`n$adminHash  $adminName`r`n$internetHash  $internetName`r`n"
          [IO.File]::WriteAllText((Join-Path $assets 'SHA256SUMS-eternal-core.txt'), $checksums, [Text.Encoding]::ASCII)
          Write-Output "::notice title=Verified Eternal Core packages::Version $version; EXE $exeHash; client ZIP $clientHash; server ZIP $serverHash; admin patch $adminHash; internet patch $internetHash. No database."
          Write-Host $checksums

      - name: Keep tested client, server, and admin patch packages
        uses: actions/upload-artifact@v4
        with:
          name: rmacro-windows-packages
          path: ${{ runner.temp }}/rmacro-release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload only to the matching draft release
        if: github.event_name == 'push'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Item 'dist\EternalCore.exe').VersionInfo.ProductVersion
          $tag = "eternal-core-v$version"
          $json = & gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases.' }
          $releases = $json | ConvertFrom-Json
          $release = $releases | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if (-not $release) { Write-Output "::notice title=Release upload::No draft for $tag; skipping."; exit 0 }
          if (-not $release.draft -or $release.prerelease -or $release.target_commitish -ne $env:GITHUB_REF_NAME) {
            Write-Output "::notice title=Release upload::Not a matching branch draft; skipping $tag."; exit 0
          }
          $remote = & git ls-remote origin "refs/heads/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0 -or -not $remote -or (($remote -split '\s+')[0] -ne $env:GITHUB_SHA)) { throw 'Branch moved; refusing stale build.' }
          $assets = Join-Path $env:RUNNER_TEMP 'rmacro-release-assets'
          & gh release upload $tag (Join-Path $assets "EternalCore-v$version-Windows.zip") (Join-Path $assets "EternalCore-Server-v$version-Windows.zip") (Join-Path $assets "EternalCore-Admin-Update-v$version.zip") (Join-Path $assets "EternalCore-Internet-Update-v$version.zip") (Join-Path $assets 'EternalCore.exe') (Join-Path $assets 'SHA256SUMS-eternal-core.txt') --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Eternal Core assets.' }
          Write-Output "::notice title=Release upload::Uploaded $tag from $env:GITHUB_REF_NAME."
